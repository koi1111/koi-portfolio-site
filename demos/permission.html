<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据权限治理演示</title><link rel="stylesheet" href="demo.css"></head><body data-demo="permission"><div class="app"><header class="topbar"><div class="brand"><i>P</i>Data Permission Gateway</div><small>模拟策略 · Portfolio Demo</small></header><div class="layout"><aside class="side"><span class="active">策略验证</span><span>角色与范围</span><span>字段分级</span><span>拦截审计</span></aside><main class="main"><div class="page-head"><div><h1>查询执行前权限检查</h1><p>切换身份和问题，观察同一查询如何被放行、缩小范围或拒绝。</p></div><span class="badge">POLICY ONLINE</span></div><section class="controls"><div class="field"><label>模拟身份</label><select id="permRole"><option value="clerk">云桥店 · 店员</option><option value="regional">华东区 · 区域负责人</option><option value="buyer">鞋履组 · 买手</option><option value="analyst">经营分析岗</option></select></div><div class="field" style="flex:1"><label>自然语言查询</label><div class="query-box"><input id="permQuery" value="查看本店本周销售额和库存"><button class="btn" id="permRun">执行检查</button></div></div><button class="btn secondary" id="permCost">尝试查询成本</button></section><div class="permission-stage" id="permGates"></div><div class="grid"><section><div class="result-banner" id="permResult"><b>等待检查</b><span>系统将在 SQL 执行前完成身份、指标、字段和数据范围校验。</span></div><section class="card"><div class="card-head"><strong>受控查询结果</strong><span class="pill" id="permStatus">PENDING</span></div><div class="table-wrap"><table><thead><tr><th>范围</th><th>销售额</th><th>库存件数</th><th>成本</th></tr></thead><tbody id="permRows"><tr><td colspan="4" class="empty">暂无查询结果</td></tr></tbody></table></div></section></section><section class="card"><div class="card-head"><strong>审计事件</strong><span class="pill">AUDIT</span></div><div class="card-body"><div class="audit" id="permAudit"><div><b>尚未执行</b><br><small>每次允许或拒绝都会记录原因。</small></div></div></div></section></div></main></div></div><script src="demo.js"></script></body></html>
