<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTB 管理系统</title><link rel="stylesheet" href="otb-demo.css"></head><body><header class="otb-top"><b><i>▤</i> OTB 管理系统</b><div><span class="online">● 在线</span><strong>演示用户</strong><button>退出</button></div></header><section class="filter-shell"><button id="otbFilterToggle">▶　筛选条件</button><span>当前周：<b>第 33 周（2026）</b></span><div class="filters" id="otbFilters" hidden><label>时间范围<select id="otbPeriod"><option value="month">8 月当月</option><option value="ytd">今年 YTD</option></select></label><label>品牌组<select id="otbGroup"><option value="all">全部品牌组</option><option value="sport">运动鞋服组</option><option value="life">生活方式组</option></select></label><label>品牌<select id="otbBrand"><option value="all">全部品牌</option><option value="north">Northline</option><option value="motion">Motion Lab</option><option value="mori">Mori Days</option></select></label><button id="otbReset">↺ 重置</button><button class="primary" id="otbApply">应用筛选</button></div></section><nav class="otb-tabs"><button class="active" data-tab="overview">总览</button><button data-tab="sales">销售</button><button data-tab="margin">毛利</button><button data-tab="stock">库存滚动</button><button data-tab="usage">OTB使用率</button><button data-tab="premanage">OTB预管理</button><button data-tab="config">⚙ 配置</button></nav><main><section class="tab-view active" data-view="overview"><article class="card"><h2>全公司汇总</h2><div class="kpis" id="otbKpis"></div></article><article class="card"><h2>主要指标 <small>— 销售 / 毛利 / 库存 / OTB · 横向：至今目标 / 目标达成 / 月度实际 / 过去12周 / 上周</small></h2><div class="matrix" id="otbMatrix"></div></article></section><section class="tab-view" data-view="sales"><article class="card"><h2>销售达成三色灯 <small>— 按品牌组</small></h2><div class="lights" id="salesLights"></div></article><article class="card"><h2>销售额（周度）</h2><div class="chart" id="salesChart"></div></article></section><section class="tab-view" data-view="margin"><article class="card"><h2>各采购组毛利率</h2><div class="lights" id="marginLights"></div></article><article class="card"><h2>销售毛利率（周度 · %）</h2><div class="line-chart"><svg viewBox="0 0 900 240" preserveAspectRatio="none"><polyline points="0,170 120,150 240,164 360,112 480,125 600,88 720,104 900,64"/><polyline class="target" points="0,115 900,115"/></svg><div class="legend">— 实际毛利率　┄ 目标毛利率</div></div></article></section><section class="tab-view" data-view="stock"><article class="card"><h2>库存金额（OTB 核心视图）<small>— 月末库存 · 门店口径 · 模拟万元</small></h2><div class="stock-grid" id="stockGrid"></div></article></section><section class="tab-view" data-view="usage"><article class="card"><h2>OTB 使用率三色灯</h2><div class="lights" id="usageLights"></div></article><article class="card"><h2>品牌下钻</h2><div class="brand-table" id="usageTable"></div></article></section><section class="tab-view" data-view="premanage"><article class="card"><h2>OTB 预管理三色灯 <small>— H2 秋冬 · 计划下单额</small></h2><div class="lights" id="preLights"></div></article><article class="card upload"><b>导入预管理数据</b><p>演示版不读取真实 Excel，点击后模拟一次格式校验。</p><button id="fakeUpload">选择模拟文件</button><span id="uploadState"></span></article></section><section class="tab-view" data-view="config"><article class="card"><h2>全局参数</h2><div class="config-grid"><label>目标售罄率<input value="75%"></label><label>目标周转天数<input value="90"></label><label>OTB 黄灯阈值<input value="80%"></label><button class="primary" id="saveConfig">保存模拟配置</button></div><p id="configState"></p></article></section></main><script src="otb-demo.js"></script></body></html>
