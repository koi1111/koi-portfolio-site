<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>行政采购协同平台 · Buyflow</title>
  <link rel="stylesheet" href="buyflow-demo.css">
</head>
<body>
  <div class="buy-shell">
    <aside class="sidebar">
      <div class="brand"><i>BF</i><span><b>行政采购</b><small>BUYFLOW</small></span></div>
      <nav aria-label="演示导航">
        <button data-nav="draft" class="active" aria-label="统一采购单"><i>＋</i><span>统一采购单</span></button>
        <button data-nav="analysis" aria-label="智能拆单"><i>⌘</i><span>智能拆单</span><em id="analysisBadge">0</em></button>
        <button data-nav="orders" aria-label="履约订单"><i>▤</i><span>履约订单</span><em>4</em></button>
        <button data-nav="logs" aria-label="运行记录"><i>≡</i><span>运行记录</span></button>
      </nav>
      <div class="sidebar-note"><b>演示说明</b><p>虚构商品与运行数据，不连接真实模型或采购系统。</p></div>
      <div class="user"><i>瑾</i><span><b>王瑾俪</b><small>采购协同演示</small></span></div>
    </aside>

    <main>
      <header class="topbar">
        <div><span>行政采购协同平台</span><i>/</i><b id="crumb">统一采购单</b></div>
        <div class="top-actions"><span class="demo-state">模拟环境</span><span class="avatar">瑾</span></div>
      </header>

      <div class="page">
        <section class="flow-card" aria-label="采购流程">
          <div class="flow-head"><strong>统一提单到履约</strong><button data-action="reset">重新演示</button></div>
          <div class="flow-track" id="flowTrack"></div>
        </section>
        <section class="stage" id="stageMount" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <div class="drawer-layer" id="logLayer" aria-hidden="true">
    <section class="run-drawer" role="dialog" aria-modal="true" aria-labelledby="runDrawerTitle">
      <header><div><span>RUN DETAIL</span><h2 id="runDrawerTitle">运行详情</h2></div><button data-action="close-log" aria-label="关闭运行详情">×</button></header>
      <div id="runDetail"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="buyflow-demo.js"></script>
</body>
</html>
